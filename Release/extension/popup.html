<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Downloader</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <img src="icons/icon32.png" alt="" width="24" height="24" />
      <h1>Downloader</h1>
      <button id="refresh" type="button" class="header-refresh" title="Kwaliteiten ophalen">↻</button>
    </header>

    <label class="field">
      <span>URL (huidige tab)</span>
      <input id="url" type="url" spellcheck="false" />
    </label>

    <label class="field row-check">
      <input id="audioOnly" type="checkbox" />
      <span>🎵 Alleen audio (MP3)</span>
    </label>

    <div class="actions">
      <button id="sendToApp" type="button" class="primary" disabled>
        Naar App
      </button>
      <button id="downloadHere" type="button" disabled>
        Direct Downloaden
      </button>
    </div>

    <div id="status" class="status" hidden></div>
    <a
      id="githubLink"
      class="ghost-link"
      href="https://github.com/redubbledd1-ops/Downloader"
      target="_blank"
      rel="noopener"
      hidden
    >
      Downloader-app niet gevonden — installatie-instructies op GitHub →
    </a>
    <progress id="progress" max="100" value="0" hidden></progress>

    <div class="row" id="qualityRow" hidden>
      <label class="field grow" id="qualityField">
        <span>Kwaliteit</span>
        <select id="quality" disabled>
          <option value="">Optioneel — anders vraagt de app</option>
        </select>
      </label>
    </div>

    <div id="downloadedActions" class="row" hidden>
      <button id="playFileBtn" type="button" class="ghost">▶ Afspelen</button>
      <button id="openFolderBtn" type="button" class="ghost">📁 Map openen</button>
    </div>

    <details class="settings">
      <summary>App-instellingen</summary>
      <p class="hint">Zelfde waarden als in de Windows-app (bron: exe). Wijzigingen worden meteen opgeslagen.</p>

      <label class="field">
        <span>Downloadmap</span>
        <input id="downloadDir" type="text" spellcheck="false" />
      </label>

      <div class="row">
        <label class="field grow">
          <span>Formaat</span>
          <select id="format">
            <option value="mp4">MP4</option>
            <option value="mp3">MP3</option>
          </select>
        </label>
        <label class="field grow">
          <span>Playlist</span>
          <select id="playlistMode">
            <option value="ask">Vragen</option>
            <option value="playlist">Hele playlist</option>
            <option value="single">Alleen video</option>
          </select>
        </label>
      </div>

      <label class="field" id="preferredQualityRow">
        <span>Video-kwaliteit (app-voorkeur)</span>
        <select id="preferredQuality">
          <option value="ask">Altijd vragen</option>
          <option value="max">Max (beste beschikbaar)</option>
          <option value="p2160">4K (2160p)</option>
          <option value="p1440">1440p</option>
          <option value="p1080">1080p</option>
          <option value="p720">720p</option>
          <option value="p480">480p</option>
          <option value="p360">360p</option>
          <option value="p240">240p</option>
          <option value="p144">144p</option>
        </select>
      </label>

      <label class="field row-check">
        <input id="autoDownload" type="checkbox" />
        <span>Extentie-icoon downloadt meteen (i.p.v. dit venster openen)</span>
      </label>

      <label class="field row-check">
        <input id="directDownloadEnabled" type="checkbox" checked />
        <span>"Direct Downloaden"-knop tonen (zonder app-UI)</span>
      </label>
    </details>

    <details class="settings debug-panel" id="debugPanel">
      <summary>Debug-log</summary>
      <p class="hint">
        Laat zien wat de extentie/TikTok-detectie doet. Handig als downloads falen.
      </p>
      <div class="debug-actions">
        <button id="debugRedetect" type="button" class="ghost">Opnieuw detecteren</button>
        <button id="debugCopy" type="button" class="ghost">Kopiëren</button>
        <button id="debugClear" type="button" class="ghost">Legen</button>
      </div>
      <pre id="debugLog" class="debug-log" aria-live="polite"></pre>
    </details>

    <script src="popup.js"></script>
  </body>
</html>
